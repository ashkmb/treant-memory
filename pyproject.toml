[project]
name = "treant"
version = "0.1.1"
description = "Graph-memory MCP service on Postgres and pgvector"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=2.3,<3",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.28",
    "uvicorn",
    "jinja2>=3.1.6",
    "authlib==1.9.1",
    "itsdangerous>=2.2",
    "python-multipart==0.0.32",
]

[project.urls]
Homepage = "https://github.com/ashkmb/treant-memory"
Repository = "https://github.com/ashkmb/treant-memory"

[project.scripts]
treant = "treant.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
