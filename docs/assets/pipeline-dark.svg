<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="906" viewBox="0 0 1000 906" role="img" aria-labelledby="ttl dsc"><title id="ttl">Treant save and distillation pipeline</title><desc id="dsc">save_session is scrubbed, stored and queued; the worker embeds and distills it; apply writes the workspace half and queues the general half; the gate runs rules, an LLM judge and the Jev judge with at most two rewrites per fact; items end published, waiting for review or blocked, and the owner reviews them.</desc><style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;}
.title{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:17px;font-weight:700;fill:#E6EDF3;}
.body{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:14.5px;fill:#A3AEBA;}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:14px;fill:#E6EDF3;}
.glabel{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;letter-spacing:1.4px;}
.alabel{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#A3AEBA;}
.caption{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;letter-spacing:1.6px;fill:#A3AEBA;}
</style><defs><marker id="ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#8B949E"/></marker><marker id="ah-forest" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#56C78F"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#FF7B72"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#F2B85B"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#A3AEBA"/></marker><marker id="ah-run" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#6FDDA0"/></marker></defs><rect x="0.5" y="0.5" width="999" height="905" rx="20" fill="#0D1117" stroke="#30363D"/><text x="24" y="38" class="caption">SAVE  →  DISTILL  →  GATE</text>
<rect x="24" y="62" width="176" height="96" rx="12" fill="#161B22" stroke="#24533B" stroke-width="1.2"/>
<rect x="25" y="72" width="4" height="76" rx="2" fill="#56C78F"/>
<text x="42" y="95.0" class="mono" font-weight="700" font-size="15.5px">save_session</text>
<text x="42" y="117.0" class="body">typed sections from</text>
<text x="42" y="137.0" class="body">a hook or an agent</text>
<rect x="218" y="62" width="176" height="96" rx="12" fill="#161B22" stroke="#24533B" stroke-width="1.2"/>
<rect x="219" y="72" width="4" height="76" rx="2" fill="#56C78F"/>
<text x="236" y="95.0" class="title">Server scrub</text>
<text x="236" y="117.0" class="body">secrets, IPs, hosts,</text>
<text x="236" y="137.0" class="body">configured terms</text>
<rect x="412" y="62" width="176" height="96" rx="12" fill="#161B22" stroke="#4D3B2A" stroke-width="1.2"/>
<rect x="413" y="72" width="4" height="76" rx="2" fill="#D4A77F"/>
<text x="430" y="95.0" class="title">Store + queue</text>
<text x="430" y="117.0" class="body">session, revision,</text>
<text x="430" y="137.0" class="body">journal, two jobs</text>
<rect x="606" y="62" width="176" height="96" rx="12" fill="#161B22" stroke="#24533B" stroke-width="1.2"/>
<rect x="607" y="72" width="4" height="76" rx="2" fill="#56C78F"/>
<text x="624" y="95.0" class="mono" font-weight="700" font-size="15.5px">embed</text>
<text x="624" y="117.0" class="body">journal, facts and</text>
<text x="624" y="137.0" class="body">nodes to vectors</text>
<rect x="800" y="62" width="176" height="96" rx="12" fill="#161B22" stroke="#24533B" stroke-width="1.2"/>
<rect x="801" y="72" width="4" height="76" rx="2" fill="#56C78F"/>
<text x="818" y="95.0" class="mono" font-weight="700" font-size="15.5px">distill</text>
<text x="818" y="117.0" class="body">one LLM call per</text>
<text x="818" y="137.0" class="body">revision</text>
<path d="M200,110 L218,110" fill="none" stroke="#56C78F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-forest)"/>
<path d="M394,110 L412,110" fill="none" stroke="#56C78F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-forest)"/>
<path d="M588,110 L606,110" fill="none" stroke="#56C78F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-forest)"/>
<path d="M782,110 L800,110" fill="none" stroke="#56C78F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-forest)"/>
<path d="M306,158 L306,206" fill="none" stroke="#FF7B72" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ah-red)"/>
<rect x="269.8" y="167" width="72.4" height="22" rx="6" fill="#0D1117"/>
<text x="306.0" y="182.5" class="alabel" text-anchor="middle" fill="#FF7B72">not sure</text>
<rect x="218" y="206" width="176" height="76" rx="12" fill="#161B22" stroke="#6E2B2D" stroke-width="1.2"/>
<rect x="219" y="216" width="4" height="56" rx="2" fill="#FF7B72"/>
<text x="236" y="229.0" class="title">Quarantine</text>
<text x="236" y="251.0" class="body">no jobs until the</text>
<text x="236" y="271.0" class="body">owner releases it</text>
<text x="694" y="184" class="body" text-anchor="middle" font-size="14px">journal entries are</text>
<text x="694" y="203" class="body" text-anchor="middle" font-size="14px">searchable once embedded</text>
<path d="M888,158 L888,340" fill="none" stroke="#56C78F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-forest)"/>
<rect x="760" y="340" width="216" height="96" rx="12" fill="#161B22" stroke="#24533B" stroke-width="1.2"/>
<rect x="761" y="350" width="4" height="76" rx="2" fill="#56C78F"/>
<text x="778" y="373.0" class="mono" font-weight="700" font-size="15.5px">apply</text>
<text x="778" y="395.0" class="body">workspace half and</text>
<text x="778" y="415.0" class="body">general half</text>
<path d="M868,436 L868,476" fill="none" stroke="#56C78F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-forest)"/>
<path d="M760,487 A108.0,11 0 0 1 976,487 V585 A108.0,11 0 0 1 760,585 Z" fill="#161B22" stroke="#24533B" stroke-width="1.4"/>
<ellipse cx="868.0" cy="487" rx="108.0" ry="11" fill="#0F2219" stroke="#24533B" stroke-width="1.4"/>
<text x="868.0" y="526.5" class="mono" text-anchor="middle" font-weight="700" font-size="15.5px" fill="#56C78F">ws_&lt;name&gt;</text>
<text x="868.0" y="548.5" class="body" text-anchor="middle">nodes, edges, facts,</text>
<text x="868.0" y="568.5" class="body" text-anchor="middle">merges, conflicts</text>
<path d="M760,388 L714,388" fill="none" stroke="#F2B85B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-amber)"/>
<rect x="24" y="310" width="690" height="254" rx="18" fill="#231C10" stroke="#5E4720" stroke-width="1.2"/>
<text x="44" y="338" class="glabel" fill="#F2B85B">GATE IN FRONT OF GENERAL</text>
<text x="694" y="338" class="body" text-anchor="end" font-size="14px">one job per queued item</text>
<rect x="48" y="358" width="194" height="92" rx="12" fill="#161B22" stroke="#5E4720" stroke-width="1.2"/>
<rect x="49" y="368" width="4" height="72" rx="2" fill="#F2B85B"/>
<text x="66" y="389.0" class="title">1  Rules</text>
<text x="66" y="411.0" class="body">ticket IDs, IPs, account</text>
<text x="66" y="431.0" class="body">IDs, domains, terms</text>
<rect x="272" y="358" width="194" height="92" rx="12" fill="#161B22" stroke="#5E4720" stroke-width="1.2"/>
<rect x="273" y="368" width="4" height="72" rx="2" fill="#F2B85B"/>
<text x="290" y="389.0" class="title">2  LLM judge</text>
<text x="290" y="411.0" class="body">workspace judge_alias,</text>
<text x="290" y="431.0" class="body">one question per kind</text>
<rect x="496" y="358" width="194" height="92" rx="12" fill="#161B22" stroke="#5E4720" stroke-width="1.2"/>
<rect x="497" y="368" width="4" height="72" rx="2" fill="#F2B85B"/>
<text x="514" y="389.0" class="title">3  Jev judge</text>
<text x="514" y="411.0" class="body">score ≥ threshold, asked</text>
<text x="514" y="431.0" class="body">only after the LLM's yes</text>
<path d="M242,404 L272,404" fill="none" stroke="#F2B85B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-amber)"/>
<path d="M466,404 L496,404" fill="none" stroke="#F2B85B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-amber)"/>
<path d="M593,450 L593.0,488.0 Q593,502 579.0,502.0 L159.0,502.0 Q145,502 145.0,488.0 L145,450" fill="none" stroke="#F2B85B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah-amber)"/>
<rect x="168.55" y="491" width="400.9" height="22" rx="6" fill="#0D1117"/>
<text x="369.0" y="506.5" class="alabel" text-anchor="middle" fill="#F2B85B">a fact fails: rewrite and gate again, at most 2 times</text>
<text x="48" y="546" class="body" font-size="14px">A judge that is down makes the job wait and retry; nothing passes on one judge.</text>
<path d="M145,564 L145,624" fill="none" stroke="#8B949E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/>
<path d="M369,564 L369,624" fill="none" stroke="#8B949E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/>
<path d="M593,564 L593,624" fill="none" stroke="#8B949E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/>
<rect x="48" y="624" width="194" height="82" rx="14" fill="#12301F" stroke="#6FDDA0" stroke-width="1.5"/>
<text x="145.0" y="658" class="mono" text-anchor="middle" font-weight="700" font-size="16px" fill="#6FDDA0">published</text>
<text x="145.0" y="684" class="body" text-anchor="middle" font-size="14px">pass, publish = auto</text>
<rect x="272" y="624" width="194" height="82" rx="14" fill="#33280F" stroke="#F5C26B" stroke-width="1.5"/>
<text x="369.0" y="658" class="mono" text-anchor="middle" font-weight="700" font-size="16px" fill="#F5C26B">waiting_review</text>
<text x="369.0" y="684" class="body" text-anchor="middle" font-size="14px">pass, publish = review</text>
<rect x="496" y="624" width="194" height="82" rx="14" fill="#3A1719" stroke="#FF8A80" stroke-width="1.5"/>
<text x="593.0" y="650" class="mono" text-anchor="middle" font-weight="700" font-size="16px" fill="#FF8A80">blocked</text>
<text x="593.0" y="676" class="body" text-anchor="middle" font-size="14px">still failing after</text>
<text x="593.0" y="695" class="body" text-anchor="middle" font-size="14px">rewrites, or a concept</text>
<rect x="760" y="624" width="216" height="82" rx="14" fill="#141A22" stroke="#30363D" stroke-width="1.2"/>
<text x="868" y="652" class="body" text-anchor="middle" font-size="14px">published items are</text>
<text x="868" y="672" class="body" text-anchor="middle" font-size="14px">readable by every</text>
<text x="868" y="692" class="body" text-anchor="middle" font-size="14px">workspace</text>
<rect x="272" y="772" width="704" height="98" rx="12" fill="#161B22" stroke="#5E4720" stroke-width="1.2"/>
<rect x="273" y="782" width="4" height="78" rx="2" fill="#F2B85B"/>
<text x="290" y="806.0" class="title">Owner review</text>
<text x="290" y="828.0" class="body">dashboard queue or treant general approve | drop, also for pending items;</text>
<text x="290" y="848.0" class="body">an approval runs the rules again on the final text and is audited</text>
<path d="M369,706 L369,772" fill="none" stroke="#F2B85B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-amber)"/>
<path d="M593,706 L593,772" fill="none" stroke="#F2B85B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-amber)"/>
<path d="M272,821 L157.0,821.0 Q145,821 145.0,809.0 L145,706" fill="none" stroke="#6FDDA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-run)"/>
<text x="206.0" y="810.5" class="alabel" text-anchor="middle" fill="#6FDDA0">approve</text></svg>
