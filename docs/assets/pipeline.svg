<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="906" viewBox="0 0 1000 906" role="img" aria-labelledby="ttl dsc"><title id="ttl">Treant save and distillation pipeline</title><desc id="dsc">save_session is scrubbed, stored and queued; the worker embeds and distills it; apply writes the workspace half and queues the general half; the gate runs rules, an LLM judge and the Jev judge with at most two rewrites per fact; items end published, waiting for review or blocked, and the owner reviews them.</desc><style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;}
.title{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:17px;font-weight:700;fill:#0F172A;}
.body{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:14.5px;fill:#475569;}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:14px;fill:#0F172A;}
.glabel{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;letter-spacing:1.4px;}
.alabel{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#475569;}
.caption{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;letter-spacing:1.6px;fill:#475569;}
</style><defs><marker id="ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#64748B"/></marker><marker id="ah-forest" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#1F6F4A"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#B42318"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#B7791F"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#475569"/></marker><marker id="ah-run" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#1F7A4D"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.07"/></filter></defs><rect x="0.5" y="0.5" width="999" height="905" rx="20" fill="#FFFFFF" stroke="#E3E9E5"/><text x="24" y="38" class="caption">SAVE  →  DISTILL  →  GATE</text>
<rect x="24" y="62" width="176" height="96" rx="12" fill="#FFFFFF" stroke="#C3DECE" stroke-width="1.2" filter="url(#sh)"/>
<rect x="25" y="72" width="4" height="76" rx="2" fill="#1F6F4A"/>
<text x="42" y="95.0" class="mono" font-weight="700" font-size="15.5px">save_session</text>
<text x="42" y="117.0" class="body">typed sections from</text>
<text x="42" y="137.0" class="body">a hook or an agent</text>
<rect x="218" y="62" width="176" height="96" rx="12" fill="#FFFFFF" stroke="#C3DECE" stroke-width="1.2" filter="url(#sh)"/>
<rect x="219" y="72" width="4" height="76" rx="2" fill="#1F6F4A"/>
<text x="236" y="95.0" class="title">Server scrub</text>
<text x="236" y="117.0" class="body">secrets, IPs, hosts,</text>
<text x="236" y="137.0" class="body">configured terms</text>
<rect x="412" y="62" width="176" height="96" rx="12" fill="#FFFFFF" stroke="#E3D4C4" stroke-width="1.2" filter="url(#sh)"/>
<rect x="413" y="72" width="4" height="76" rx="2" fill="#7A5A40"/>
<text x="430" y="95.0" class="title">Store + queue</text>
<text x="430" y="117.0" class="body">session, revision,</text>
<text x="430" y="137.0" class="body">journal, two jobs</text>
<rect x="606" y="62" width="176" height="96" rx="12" fill="#FFFFFF" stroke="#C3DECE" stroke-width="1.2" filter="url(#sh)"/>
<rect x="607" y="72" width="4" height="76" rx="2" fill="#1F6F4A"/>
<text x="624" y="95.0" class="mono" font-weight="700" font-size="15.5px">embed</text>
<text x="624" y="117.0" class="body">journal, facts and</text>
<text x="624" y="137.0" class="body">nodes to vectors</text>
<rect x="800" y="62" width="176" height="96" rx="12" fill="#FFFFFF" stroke="#C3DECE" stroke-width="1.2" filter="url(#sh)"/>
<rect x="801" y="72" width="4" height="76" rx="2" fill="#1F6F4A"/>
<text x="818" y="95.0" class="mono" font-weight="700" font-size="15.5px">distill</text>
<text x="818" y="117.0" class="body">one LLM call per</text>
<text x="818" y="137.0" class="body">revision</text>
<path d="M200,110 L218,110" fill="none" stroke="#1F6F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-forest)"/>
<path d="M394,110 L412,110" fill="none" stroke="#1F6F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-forest)"/>
<path d="M588,110 L606,110" fill="none" stroke="#1F6F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-forest)"/>
<path d="M782,110 L800,110" fill="none" stroke="#1F6F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-forest)"/>
