<rect x="269.8" y="167" width="72.4" height="22" rx="6" fill="#FFFFFF"/>
<text x="306.0" y="182.5" class="alabel" text-anchor="middle" fill="#B42318">not sure</text>
<rect x="218" y="206" width="176" height="76" rx="12" fill="#FFFFFF" stroke="#F2BDB6" stroke-width="1.2" filter="url(#sh)"/>
<rect x="219" y="216" width="4" height="56" rx="2" fill="#B42318"/>
<text x="236" y="229.0" class="title">Quarantine</text>
<text x="236" y="251.0" class="body">no jobs until the</text>
<text x="236" y="271.0" class="body">owner releases it</text>
<text x="694" y="184" class="body" text-anchor="middle" font-size="14px">journal entries are</text>
<text x="694" y="203" class="body" text-anchor="middle" font-size="14px">searchable once embedded</text>
<path d="M888,158 L888,340" fill="none" stroke="#1F6F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-forest)"/>
<rect x="760" y="340" width="216" height="96" rx="12" fill="#FFFFFF" stroke="#C3DECE" stroke-width="1.2" filter="url(#sh)"/>
<rect x="761" y="350" width="4" height="76" rx="2" fill="#1F6F4A"/>
<text x="778" y="373.0" class="mono" font-weight="700" font-size="15.5px">apply</text>
<text x="778" y="395.0" class="body">workspace half and</text>
<text x="778" y="415.0" class="body">general half</text>
<path d="M868,436 L868,476" fill="none" stroke="#1F6F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-forest)"/>
<path d="M760,487 A108.0,11 0 0 1 976,487 V585 A108.0,11 0 0 1 760,585 Z" fill="#FFFFFF" stroke="#C3DECE" stroke-width="1.4" filter="url(#sh)"/>
<ellipse cx="868.0" cy="487" rx="108.0" ry="11" fill="#EEF6F1" stroke="#C3DECE" stroke-width="1.4"/>
<text x="868.0" y="526.5" class="mono" text-anchor="middle" font-weight="700" font-size="15.5px" fill="#1F6F4A">ws_&lt;name&gt;</text>
<text x="868.0" y="548.5" class="body" text-anchor="middle">nodes, edges, facts,</text>
<text x="868.0" y="568.5" class="body" text-anchor="middle">merges, conflicts</text>
<path d="M760,388 L714,388" fill="none" stroke="#B7791F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-amber)"/>
<rect x="24" y="310" width="690" height="254" rx="18" fill="#FDF5E6" stroke="#F0D39E" stroke-width="1.2"/>
<text x="44" y="338" class="glabel" fill="#B7791F">GATE IN FRONT OF GENERAL</text>
<text x="694" y="338" class="body" text-anchor="end" font-size="14px">one job per queued item</text>
<rect x="48" y="358" width="194" height="92" rx="12" fill="#FFFFFF" stroke="#F0D39E" stroke-width="1.2" filter="url(#sh)"/>
<rect x="49" y="368" width="4" height="72" rx="2" fill="#B7791F"/>
<text x="66" y="389.0" class="title">1  Rules</text>
<text x="66" y="411.0" class="body">ticket IDs, IPs, account</text>
<text x="66" y="431.0" class="body">IDs, domains, terms</text>
<rect x="272" y="358" width="194" height="92" rx="12" fill="#FFFFFF" stroke="#F0D39E" stroke-width="1.2" filter="url(#sh)"/>
<rect x="273" y="368" width="4" height="72" rx="2" fill="#B7791F"/>
<text x="290" y="389.0" class="title">2  LLM judge</text>
<text x="290" y="411.0" class="body">workspace judge_alias,</text>
<text x="290" y="431.0" class="body">one question per kind</text>
<rect x="496" y="358" width="194" height="92" rx="12" fill="#FFFFFF" stroke="#F0D39E" stroke-width="1.2" filter="url(#sh)"/>
<rect x="497" y="368" width="4" height="72" rx="2" fill="#B7791F"/>
<text x="514" y="389.0" class="title">3  Jev judge</text>
<text x="514" y="411.0" class="body">score ≥ threshold, asked</text>
<text x="514" y="431.0" class="body">only after the LLM's yes</text>
<path d="M242,404 L272,404" fill="none" stroke="#B7791F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-amber)"/>
<path d="M466,404 L496,404" fill="none" stroke="#B7791F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-amber)"/>
<path d="M593,450 L593.0,488.0 Q593,502 579.0,502.0 L159.0,502.0 Q145,502 145.0,488.0 L145,450" fill="none" stroke="#B7791F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah-amber)"/>
<rect x="168.55" y="491" width="400.9" height="22" rx="6" fill="#FFFFFF"/>
<text x="369.0" y="506.5" class="alabel" text-anchor="middle" fill="#B7791F">a fact fails: rewrite and gate again, at most 2 times</text>
<text x="48" y="546" class="body" font-size="14px">A judge that is down makes the job wait and retry; nothing passes on one judge.</text>
<path d="M145,564 L145,624" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/>
<path d="M369,564 L369,624" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/>
<path d="M593,564 L593,624" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/>
<rect x="48" y="624" width="194" height="82" rx="14" fill="#E3F3E9" stroke="#1F7A4D" stroke-width="1.5"/>
<text x="145.0" y="658" class="mono" text-anchor="middle" font-weight="700" font-size="16px" fill="#1F7A4D">published</text>
<text x="145.0" y="684" class="body" text-anchor="middle" font-size="14px">pass, publish = auto</text>
<rect x="272" y="624" width="194" height="82" rx="14" fill="#FCEFD3" stroke="#9A6200" stroke-width="1.5"/>
<text x="369.0" y="658" class="mono" text-anchor="middle" font-weight="700" font-size="16px" fill="#9A6200">waiting_review</text>
<text x="369.0" y="684" class="body" text-anchor="middle" font-size="14px">pass, publish = review</text>
<rect x="496" y="624" width="194" height="82" rx="14" fill="#FBE3E0" stroke="#B42318" stroke-width="1.5"/>
<text x="593.0" y="650" class="mono" text-anchor="middle" font-weight="700" font-size="16px" fill="#B42318">blocked</text>
<text x="593.0" y="676" class="body" text-anchor="middle" font-size="14px">still failing after</text>
<text x="593.0" y="695" class="body" text-anchor="middle" font-size="14px">rewrites, or a concept</text>
<rect x="760" y="624" width="216" height="82" rx="14" fill="#F3F6F9" stroke="#D6DEE7" stroke-width="1.2"/>
<text x="868" y="652" class="body" text-anchor="middle" font-size="14px">published items are</text>
<text x="868" y="672" class="body" text-anchor="middle" font-size="14px">readable by every</text>
<text x="868" y="692" class="body" text-anchor="middle" font-size="14px">workspace</text>
<rect x="272" y="772" width="704" height="98" rx="12" fill="#FFFFFF" stroke="#F0D39E" stroke-width="1.2" filter="url(#sh)"/>
<rect x="273" y="782" width="4" height="78" rx="2" fill="#B7791F"/>
<text x="290" y="806.0" class="title">Owner review</text>
<text x="290" y="828.0" class="body">dashboard queue or treant general approve | drop, also for pending items;</text>
<text x="290" y="848.0" class="body">an approval runs the rules again on the final text and is audited</text>
<path d="M369,706 L369,772" fill="none" stroke="#B7791F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-amber)"/>
<path d="M593,706 L593,772" fill="none" stroke="#B7791F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-amber)"/>
