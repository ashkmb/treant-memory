<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="556" viewBox="0 0 1000 556" role="img" aria-labelledby="ttl dsc"><title id="ttl">Treant features</title><desc id="dsc">Six feature cards: memory across sessions, isolated workspaces, gated shared know-how, scrubbing before storage, a command guard and an owner dashboard.</desc><style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;}
.title{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:17px;font-weight:700;fill:#0F172A;}
.body{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:14.5px;fill:#475569;}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:14px;fill:#0F172A;}
.glabel{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;letter-spacing:1.4px;}
.alabel{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#475569;}
.caption{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;letter-spacing:1.6px;fill:#475569;}
</style><defs><marker id="ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#64748B"/></marker><marker id="ah-forest" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#1F6F4A"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#B42318"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#B7791F"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#475569"/></marker><marker id="ah-run" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#1F7A4D"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.07"/></filter></defs><rect x="0.5" y="0.5" width="999" height="555" rx="20" fill="#FFFFFF" stroke="#E3E9E5"/><rect x="24" y="24" width="304" height="244" rx="16" fill="#FFFFFF" stroke="#D5DED8" stroke-width="1.2" filter="url(#sh)"/>
<rect x="48" y="48" width="60" height="60" rx="14" fill="#EEF6F1" stroke="#C3DECE" stroke-width="1.2"/>
<g transform="translate(58 58)" fill="none" stroke="#1F6F4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="13"/><path d="M20 12v8l5 4"/><path d="M5 9v6h6"/></g>
<text x="48" y="144" class="title" font-size="19px">Memory across sessions</text>
<text x="48" y="176" class="body" font-size="15.5px">A brief at session start, a save</text>
<text x="48" y="200" class="body" font-size="15.5px">at session end, hybrid search over</text>
<text x="48" y="224" class="body" font-size="15.5px">vectors and a knowledge graph.</text>
<rect x="348" y="24" width="304" height="244" rx="16" fill="#FFFFFF" stroke="#D5DED8" stroke-width="1.2" filter="url(#sh)"/>
<rect x="372" y="48" width="60" height="60" rx="14" fill="#F7F2EC" stroke="#E3D4C4" stroke-width="1.2"/>
<g transform="translate(382 58)" fill="none" stroke="#7A5A40" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 34 13 20 20 6 13Z"/><path d="M6 20l14 7 14-7"/><path d="M6 27l14 7 14-7"/></g>
<text x="372" y="144" class="title" font-size="19px">Isolated workspaces</text>
<text x="372" y="176" class="body" font-size="15.5px">One Postgres schema and role per</text>
<text x="372" y="200" class="body" font-size="15.5px">workspace. A token reaches</text>
<text x="372" y="224" class="body" font-size="15.5px">exactly one workspace.</text>
<rect x="672" y="24" width="304" height="244" rx="16" fill="#FFFFFF" stroke="#D5DED8" stroke-width="1.2" filter="url(#sh)"/>
<rect x="696" y="48" width="60" height="60" rx="14" fill="#FDF5E6" stroke="#F0D39E" stroke-width="1.2"/>
<g transform="translate(706 58)" fill="none" stroke="#B7791F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 34V12a12 12 0 0 1 24 0v22"/><path d="M4 34h32"/><path d="M14 22l4 4 8-8"/></g>
<text x="696" y="144" class="title" font-size="19px">Gated shared know-how</text>
<text x="696" y="176" class="body" font-size="15.5px">Rules, an LLM judge and the Jev</text>
<text x="696" y="200" class="body" font-size="15.5px">judge decide what may enter the</text>
<text x="696" y="224" class="body" font-size="15.5px">shared general schema.</text>
<rect x="24" y="288" width="304" height="244" rx="16" fill="#FFFFFF" stroke="#D5DED8" stroke-width="1.2" filter="url(#sh)"/>
<rect x="48" y="312" width="60" height="60" rx="14" fill="#EEF6F1" stroke="#C3DECE" stroke-width="1.2"/>
<g transform="translate(58 322)" fill="none" stroke="#1F6F4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4 33 9v10c0 8-6 14-13 17C13 33 7 27 7 19V9Z"/><path d="M14 15h12M14 21h8M14 27h10"/></g>
<text x="48" y="408" class="title" font-size="19px">Scrubbed before storage</text>
<text x="48" y="440" class="body" font-size="15.5px">Client and server remove secrets,</text>
<text x="48" y="464" class="body" font-size="15.5px">IPs and host names. Unsure saves</text>
<text x="48" y="488" class="body" font-size="15.5px">wait in quarantine.</text>
<rect x="348" y="288" width="304" height="244" rx="16" fill="#FFFFFF" stroke="#D5DED8" stroke-width="1.2" filter="url(#sh)"/>
<rect x="372" y="312" width="60" height="60" rx="14" fill="#FDEEEC" stroke="#F2BDB6" stroke-width="1.2"/>
<g transform="translate(382 322)" fill="none" stroke="#B42318" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="32" height="26" rx="4"/><path d="M10 15l5 4-5 4"/><path d="M19 25h10"/></g>
<text x="372" y="408" class="title" font-size="19px">Command guard</text>
<text x="372" y="440" class="body" font-size="15.5px">Checks kubectl, aws, terraform, git</text>
<text x="372" y="464" class="body" font-size="15.5px">push and more before they run:</text>
<text x="372" y="488" class="body" font-size="15.5px">run, ask or deny per target.</text>
<rect x="672" y="288" width="304" height="244" rx="16" fill="#FFFFFF" stroke="#D5DED8" stroke-width="1.2" filter="url(#sh)"/>
<rect x="696" y="312" width="60" height="60" rx="14" fill="#F3F6F9" stroke="#D6DEE7" stroke-width="1.2"/>
<g transform="translate(706 322)" fill="none" stroke="#475569" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="32" height="28" rx="4"/><path d="M4 13h32"/><circle cx="13" cy="24" r="3"/><circle cx="27" cy="20" r="3"/><circle cx="24" cy="29" r="2.5"/><path d="M15.8 23 24 20.6M25.6 22.6 24.5 26.6"/></g>
<text x="696" y="408" class="title" font-size="19px">Owner dashboard</text>
<text x="696" y="440" class="body" font-size="15.5px">Review queue, memory browser with</text>
<text x="696" y="464" class="body" font-size="15.5px">history, graph view, audit log.</text>
<text x="696" y="488" class="body" font-size="15.5px">OIDC login, no JavaScript.</text></svg>
