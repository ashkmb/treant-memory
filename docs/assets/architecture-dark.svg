<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="874" viewBox="0 0 1000 874" role="img" aria-labelledby="ttl dsc"><title id="ttl">Treant system overview</title><desc id="dsc">Developer machine with Claude Code, Kiro, treant-client, treant-guard and the Keychain; a TLS reverse proxy; the Treant host running serve, dashboard, the owner CLI and the worker on Postgres with control, general and one schema per workspace; external embedding service, LLM gateway, Jev judge and OIDC provider; nightly backup and isolation test.</desc><style>
