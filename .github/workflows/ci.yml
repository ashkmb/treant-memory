name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: server (root)
    runs-on: ubuntu-24.04
    services:
      # Same image, port and password as compose.test.yml, so the DB tests run instead of
      # skipping (tests/conftest.py connects to 127.0.0.1:55432 as postgres/test).
      pg:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q

  client:
    name: client
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q

  guard:
    name: guard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q

  quickstart:
    # The README quick start, end to end: compose stack from this checkout, bootstrap, token,
    # a save over MCP and a search that finds it (scripts/quickstart-smoke.sh).
    name: quickstart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: BUILD=1 scripts/quickstart-smoke.sh
      - if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v
